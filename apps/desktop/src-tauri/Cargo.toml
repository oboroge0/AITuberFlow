[package]
name = "aituber-flow"
version = "2.6.0"
description = "AITuberFlow Desktop - Visual workflow editor for AI VTuber streaming"
authors = ["AITuberFlow"]
edition = "2021"

[lib]
name = "aituber_flow_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# devtools 機能 (WebView インスペクタ等) は dev 時のみ有効化。
# release ビルドでは feature を渡さないため、エンドユーザーが内部 IPC を直接実行できない。
# dev で有効化するには `tauri dev --features devtools` (apps/desktop/package.json の dev スクリプト参照)。
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
