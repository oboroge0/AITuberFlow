name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check versions match tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"

      - name: Check tag commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::タグのコミットが main 上にありません。main からタグを作成してください"
            exit 1
          fi

      - name: Skip notice
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "手動実行のためタグ検証をスキップしました"

  build-desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            sidecar-suffix: '-aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            sidecar-suffix: '-x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-target: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
            sidecar-suffix: '-x86_64-pc-windows-msvc.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # キャッシュは desktop-cache-warm.yml が main 上で生成したものを復元する
      # （shared-key を一致させること）。タグ ref で保存しても次のタグ run から
      # 復元できないため、保存はしない（save-if: false）
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          shared-key: desktop-${{ matrix.rust-target }}
          save-if: false

      # Build frontend static export
      - name: Install frontend dependencies
        run: cd apps/web && npm ci

      - name: Build frontend (static export)
        run: cd apps/web && npx next build
        env:
          BUILD_MODE: desktop

      # Install SDK dependencies (needed for copy-resources.js SDK bundling)
      - name: Install SDK dependencies
        run: cd packages/sdk-ts && bun install

      # Build Bun server sidecar
      - name: Install server dependencies
        run: cd apps/server-ts && bun install

      - name: Build server sidecar
        run: |
          cd apps/server-ts
          bun build --compile --target=${{ matrix.bun-target }} src/index.ts --outfile=../desktop/src-tauri/binaries/server${{ matrix.sidecar-suffix }}

      # Copy resources into Tauri bundle
      - name: Copy resources
        run: node apps/desktop/scripts/copy-resources.js

      # Install Tauri CLI and build
      - name: Install desktop dependencies
        run: cd apps/desktop && npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'AITuberFlow ${{ github.ref_name }}'
          releaseBody: 'See [CHANGELOG](https://github.com/oboroge0/AITuberFlow/blob/main/CHANGELOG.md) for details.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
