name: CI

on:
  push:
    branches: [main, agent-dev]
  pull_request:
    branches: [main, agent-dev]

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes type check)
        run: npm run build

  backend-ts:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server-ts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install SDK dependencies
        working-directory: packages/sdk-ts
        run: bun install

      - name: Type check
        run: bun run typecheck

  test-ts:
    name: Run Tests (TypeScript)
    runs-on: ubuntu-latest
    needs: [backend-ts]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install server-ts dependencies
        working-directory: apps/server-ts
        run: bun install

      - name: Install SDK dependencies
        working-directory: packages/sdk-ts
        run: bun install

      - name: Install root dependencies
        run: bun install

      - name: Run TypeScript tests
        run: bun test tests/engine/ tests/routes/ --verbose
