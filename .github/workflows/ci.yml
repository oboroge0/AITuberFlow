name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: node scripts/check-versions.mjs

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes type check)
        run: npm run build

  backend-ts:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server-ts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install SDK dependencies
        working-directory: packages/sdk-ts
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Lint & Format (Biome)
        run: bun run lint

  test-ts:
    name: Run Tests (TypeScript)
    runs-on: ubuntu-latest
    needs: [backend-ts]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install server-ts dependencies
        working-directory: apps/server-ts
        run: bun install

      - name: Install SDK dependencies
        working-directory: packages/sdk-ts
        run: bun install

      - name: Install root dependencies
        run: bun install

      - name: Run TypeScript tests
        run: bun test tests/ --verbose --coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
