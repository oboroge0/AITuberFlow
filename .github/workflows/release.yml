name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check versions match tag
        run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"

      - name: Check tag commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::タグのコミットが main 上にありません。main からタグを作成してください"
            exit 1
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: release_notes
        run: |
          # タグは v 付き、CHANGELOG の見出しは v なし
          VERSION=${GITHUB_REF#refs/tags/}
          PLAIN=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          awk -v ver="$PLAIN" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) found = 1 }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md から $PLAIN のセクションを抽出できませんでした"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.release_notes.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
