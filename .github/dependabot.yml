# 依存関係の自動更新設定
# バージョン更新の PR は dev へ向ける（セキュリティ更新のみ GitHub の仕様で
# デフォルトブランチ (main) に向くため、マージ後は hotfix と同様に dev へ戻すこと）
version: 2
updates:
  # npm (package-lock.json)
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/web"
      - "/apps/desktop"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # bun (bun.lock)
  - package-ecosystem: "bun"
    directories:
      - "/apps/server-ts"
      - "/packages/sdk-ts"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # cargo (Tauri)
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
